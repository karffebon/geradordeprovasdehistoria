<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gerador de Provas — História IFSUL</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="assets/logo.svg" alt="EMEF Universitário"><div><strong>EMEF Universitário</strong><span>Gerador de Provas • História IFSUL</span></div></div>
  <div class="pill" id="bankStatus">Banco: —</div>
</header>
<main class="layout">
  <aside class="panel controls">
    <h1>Montar avaliações</h1>
    <p class="muted">Crie até 3 provas trimestrais sem repetir questões entre elas.</p>

    <label>Quantidade de provas
      <select id="testCount"><option value="1">1 prova</option><option value="2">2 provas</option><option value="3">3 provas (1 por trimestre)</option></select>
    </label>

    <label>Questões por prova
      <input id="questionsPerTest" type="number" min="1" max="40" value="10">
    </label>

    <div class="tier-grid">
      <label>Tier 1 · Fácil<input id="tier1" type="number" min="0" value="4"></label>
      <label>Tier 2 · Médio<input id="tier2" type="number" min="0" value="3"></label>
      <label>Tier 3 · Difícil<input id="tier3" type="number" min="0" value="3"></label>
    </div>
    <div class="hint" id="mixHint">A soma dos tiers deve ser igual ao número de questões.</div>

    <label>Título da avaliação<input id="testTitle" value="Avaliação de História"></label>
    <label>Turma / ano<input id="className" placeholder="Ex.: 9º ano A"></label>
    <label>Professor(a)<input id="teacherName" placeholder="Nome do(a) professor(a)"></label>

    <div class="actions">
      <button class="primary" id="generateBtn">Gerar prova(s)</button>
      <button id="rerollBtn" disabled>Reroll selecionadas</button>
    </div>
    <div class="actions secondary-actions">
      <button id="printTestsBtn" disabled>Exportar prova(s) em PDF</button>
      <button id="printKeyBtn" disabled>Exportar gabarito em PDF</button>
    </div>
    <div class="actions secondary-actions">
      <button id="exportJsonBtn" disabled>Exportar seleção JSON</button>
      <label class="file-btn">Importar banco JSON<input id="importJson" type="file" accept="application/json"></label>
    </div>
    <div class="notice" id="message"></div>
  </aside>

  <section class="workspace">
    <div class="empty" id="emptyState"><div class="empty-icon">✦</div><h2>Nenhuma prova gerada</h2><p>Configure a distribuição de dificuldade e clique em <b>Gerar prova(s)</b>.</p></div>
    <div id="testsContainer"></div>
  </section>
</main>
<div id="printArea"></div>
<script src="data/questions.js"></script>
<script src="app.js"></script>
</body>
</html>
